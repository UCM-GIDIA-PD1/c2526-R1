<!DOCTYPE html>
<html lang="es">
<body>

<h2>Clasificador de flores Iris</h2>
<p>Introduce las medidas de la flor (en centímetros) y pulsa Enviar.</p>
<p>Los valores por defecto corresponden a una <em>Iris setosa</em> real del dataset.</p>

<!--
  El atributo action indica la URL del servidor que recibirá los datos.
  El atributo method="post" indica que los datos viajan en el cuerpo de la petición,
  no en la URL (a diferencia de method="get").
-->
<form action="/iris/predict/html" method="post">

  <!--
    Cada campo tiene:
    - label: etiqueta visible para el usuario. El atributo for debe coincidir
      con el id del input correspondiente.
    - input: campo de entrada. El atributo name debe coincidir con el nombre
      del parámetro esperado por el servidor.
  -->
  <label for="sepal_length">Longitud del sépalo (cm):</label><br>
  <input type="number" id="sepal_length" name="sepal_length" step="0.1" value="5.1"><br><br>

  <label for="sepal_width">Anchura del sépalo (cm):</label><br>
  <input type="number" id="sepal_width" name="sepal_width" step="0.1" value="3.5"><br><br>

  <label for="petal_length">Longitud del pétalo (cm):</label><br>
  <input type="number" id="petal_length" name="petal_length" step="0.1" value="1.4"><br><br>

  <label for="petal_width">Anchura del pétalo (cm):</label><br>
  <input type="number" id="petal_width" name="petal_width" step="0.1" value="0.2"><br><br>

  <!-- Al pulsar este botón el navegador envía el formulario al servidor y recarga la página -->
  <input type="submit" value="Clasificar">

</form>

</body>
</html>
