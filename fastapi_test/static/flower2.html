<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador de flores Iris</title>
    <!--
      Bootstrap es un framework CSS que proporciona estilos y componentes listos para usar.
      Lo cargamos desde un CDN (Content Delivery Network): un servidor externo que lo distribuye
      sin que tengamos que instalar nada en nuestro proyecto.
      El HTML es idéntico al de flower1.html; solo cambian las clases CSS.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
</head>
<!--
  Bootstrap funciona añadiendo clases CSS predefinidas a los elementos HTML.
  Por ejemplo:
  - "bg-light"   → fondo gris claro
  - "container"  → centra el contenido y limita su anchura
  - "card"       → crea una tarjeta con borde y sombra
  - "mb-3"       → añade margen inferior (margin-bottom)
  - "form-label" → estilo de etiqueta de formulario
  - "form-control" → estilo de campo de entrada
  - "btn btn-primary" → botón azul
  - "w-100"      → anchura del 100%
-->
<body class="bg-light">

<div class="container mt-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-1">Clasificador de flores Iris</h2>
            <p class="text-muted mb-4">
                Introduce las medidas de la flor (en centímetros).<br>
                Los valores por defecto corresponden a una <em>Iris setosa</em> real del dataset.
            </p>

            <form action="/iris/predict/html" method="post">
                <div class="mb-3">
                    <label for="sepal_length" class="form-label">Longitud del sépalo (cm)</label>
                    <input type="number" class="form-control" id="sepal_length" name="sepal_length" step="0.1" value="5.1">
                </div>
                <div class="mb-3">
                    <label for="sepal_width" class="form-label">Anchura del sépalo (cm)</label>
                    <input type="number" class="form-control" id="sepal_width" name="sepal_width" step="0.1" value="3.5">
                </div>
                <div class="mb-3">
                    <label for="petal_length" class="form-label">Longitud del pétalo (cm)</label>
                    <input type="number" class="form-control" id="petal_length" name="petal_length" step="0.1" value="1.4">
                </div>
                <div class="mb-3">
                    <label for="petal_width" class="form-label">Anchura del pétalo (cm)</label>
                    <input type="number" class="form-control" id="petal_width" name="petal_width" step="0.1" value="0.2">
                </div>
                <button type="submit" class="btn btn-primary w-100">Clasificar</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
