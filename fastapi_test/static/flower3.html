<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador de flores Iris (fetch)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-1">Clasificador de flores Iris</h2>
            <p class="text-muted mb-4">
                En este ejemplo el cliente llama al servidor con <code>fetch()</code>
                y actualiza la página con el resultado <strong>sin recargarla</strong>.
            </p>

            <!--
              A diferencia de flower1 y flower2, este formulario no tiene action ni method.
              No se envía al servidor de forma tradicional: el envío lo gestiona JavaScript.
              El atributo id="flower-form" permite identificarlo desde el código JavaScript.
            -->
            <form id="flower-form">
                <div class="mb-3">
                    <label for="sepal_length" class="form-label">Longitud del sépalo (cm)</label>
                    <input type="number" class="form-control" id="sepal_length" step="0.1" value="5.1">
                </div>
                <div class="mb-3">
                    <label for="sepal_width" class="form-label">Anchura del sépalo (cm)</label>
                    <input type="number" class="form-control" id="sepal_width" step="0.1" value="3.5">
                </div>
                <div class="mb-3">
                    <label for="petal_length" class="form-label">Longitud del pétalo (cm)</label>
                    <input type="number" class="form-control" id="petal_length" step="0.1" value="1.4">
                </div>
                <div class="mb-3">
                    <label for="petal_width" class="form-label">Anchura del pétalo (cm)</label>
                    <input type="number" class="form-control" id="petal_width" step="0.1" value="0.2">
                </div>
                <button type="submit" class="btn btn-primary w-100">Clasificar</button>
            </form>

            <!--
              Este bloque está oculto al principio (display: none).
              JavaScript lo hace visible cuando el servidor devuelve la predicción,
              rellenando los <span> con los valores recibidos.
            -->
            <div id="resultado" class="mt-4" style="display: none;">
                <hr>
                <h5>Resultado</h5>
                <p><b>Clase predicha:</b> <span id="clase"></span></p>
                <p><b>Probabilidades:</b></p>
                <ul>
                    <li>Setosa: <span id="prob_setosa"></span>%</li>
                    <li>Versicolor: <span id="prob_versicolor"></span>%</li>
                    <li>Virginica: <span id="prob_virginica"></span>%</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    const CLASES = ['setosa', 'versicolor', 'virginica'];

    // Escuchamos el evento 'submit' del formulario en lugar de dejar que el navegador lo envíe
    document.getElementById('flower-form').addEventListener('submit', async function(event) {
        // Cancelar el comportamiento por defecto del formulario (recargar la página)
        event.preventDefault();

        // Recoger los valores del formulario como un objeto JavaScript
        const datos = {
            sepal_length: parseFloat(document.getElementById('sepal_length').value),
            sepal_width:  parseFloat(document.getElementById('sepal_width').value),
            petal_length: parseFloat(document.getElementById('petal_length').value),
            petal_width:  parseFloat(document.getElementById('petal_width').value),
        };

        // Llamar al endpoint JSON del servidor con fetch():
        // - method: 'POST' indica el tipo de petición HTTP
        // - headers: indica que el cuerpo de la petición está en formato JSON
        // - body: los datos convertidos a texto JSON con JSON.stringify()
        const respuesta = await fetch('/iris/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
        });

        // Convertir la respuesta JSON del servidor en un objeto JavaScript
        const resultado = await respuesta.json();
        // resultado = { label: 0, probs: [0.99, 0.01, 0.0] }

        // Actualizar los <span> del bloque de resultado con los valores recibidos
        document.getElementById('clase').textContent           = CLASES[resultado.label];
        document.getElementById('prob_setosa').textContent     = (resultado.probs[0] * 100).toFixed(1);
        document.getElementById('prob_versicolor').textContent = (resultado.probs[1] * 100).toFixed(1);
        document.getElementById('prob_virginica').textContent  = (resultado.probs[2] * 100).toFixed(1);

        // Hacer visible el bloque de resultado
        document.getElementById('resultado').style.display = 'block';
    });
</script>

</body>
</html>
