<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador de género de vídeo</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        button {
            background: #ff7e5f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #e86a50;
        }

        .result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .loading {
            margin-top: 20px;
            display: none;
        }

        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 20px;
            background: #f1f1f1;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎭 Clasificador de Género</h1>
    <p>Pega la URL de un vídeo y descubre su categoría</p>

    <input type="text" id="videoUrl" placeholder="https://...">

    <button onclick="classifyGenre()">Clasificar</button>

    <div class="loading" id="loading">⏳ Analizando contenido...</div>

    <div id="result" class="result"></div>
    <div id="confidence" class="badge" style="display:none;"></div>
</div>

<script>
async function classifyGenre() {
    const url = document.getElementById("videoUrl").value;
    const resultDiv = document.getElementById("result");
    const loading = document.getElementById("loading");
    const confidence = document.getElementById("confidence");

    resultDiv.style.display = "none";
    confidence.style.display = "none";
    loading.style.display = "block";

    try {
        const response = await fetch("/video/genre", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        loading.style.display = "none";
        resultDiv.style.display = "block";
        confidence.style.display = "inline-block";

        resultDiv.innerHTML = `🎬 Género: ${data.genre}`;
        confidence.innerHTML = `Confianza: ${(data.confidence * 100).toFixed(1)}%`;

    } catch (error) {
        loading.style.display = "none";
        resultDiv.style.display = "block";
        resultDiv.innerHTML = "❌ Error al clasificar";
    }
}
</script>

</body>
</html>
